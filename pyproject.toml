[project]
name = "autoresearch"
version = "0.2.0"
description = "Autonomous Qwen fine-tuning research swarm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.4.0",
    "datasets>=3.0.0",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "peft>=0.14.0",
    "torch==2.9.1",
    "transformers>=4.48.0",
    "trl>=0.15.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
